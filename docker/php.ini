; The code base is fixed for the life of the image, so the cache never needs to
; check timestamps and can hold every file it compiles.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.interned_strings_buffer = 16

expose_php = Off
memory_limit = 256M
post_max_size = 4M
upload_max_filesize = 4M
