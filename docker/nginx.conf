user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;

    access_log /dev/stdout;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 4m;

    # TLS is terminated by the platform proxy, so the scheme reaches PHP through
    # the forwarded header rather than the connection itself.
    map $http_x_forwarded_proto $fastcgi_https {
        default '';
        https on;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/typescript
        application/xml
        image/svg+xml
        text/css
        text/plain
        text/xml;

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;

        # The built documentation is the web root. `dist/api` is a symlink to
        # the Symfony front controller directory, which puts the app on the same
        # origin as the pages that call it.
        root /app/packages/docs/.vitepress/dist;
        index index.html;
        error_page 404 /404.html;

        # Redirects send a path rather than a full URL. The public scheme and
        # host live on the platform proxy, so anything nginx built from its own
        # listener would point at the internal port over plain HTTP.
        absolute_redirect off;

        # Redirects and content-type rules shared with the local DDEV setup.
        include /etc/nginx/fragments/prod-00-redirect-old-prefix.conf;
        include /etc/nginx/fragments/prod-10-reference-redirects.conf;
        include /etc/nginx/fragments/prod-api.conf;
        include /etc/nginx/fragments/prod-dts.conf;
        include /etc/nginx/fragments/prod-markdown-text-plain.conf;
        include /etc/nginx/fragments/prod-md-files-if-exist.conf;

        # The FastCGI block the `/api` fragment hands its internal redirect to.
        location ~ \.php$ {
            try_files $uri =404;
            include fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $document_root;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_param HTTPS $fastcgi_https;
            fastcgi_buffer_size 32k;
            fastcgi_buffers 16 16k;
            fastcgi_read_timeout 60s;
        }

        # `$uri` is a directory here, which `try_files` would resolve to the same
        # URI and loop on, so the home page names its file.
        location = / {
            try_files /index.html =404;
        }

        location / {
            try_files $uri $uri.html $uri/index.html =404;
        }

        # Static assets carry a content hash in their name, so they can sit in a
        # browser cache. This block comes after the fragments, which keeps the
        # `X-TypeScript-Types` header on the playground bundles.
        location ~* \.(js|css|woff2|png|jpe?g|gif|svg|webp|avif|mp4|webm|ico)$ {
            expires 7d;
        }
    }
}
