# Redirect the former Components reference to the metadata-driven Reference section.
location = /components {
    return 301 /reference/$is_args$args;
}

location = /components/ {
    return 301 /reference/$is_args$args;
}

location = /components/index.html {
    return 301 /reference/$is_args$args;
}

location = /components/index.md {
    return 301 /reference/$is_args$args;
}

location = /components.html {
    return 301 /reference/$is_args$args;
}

location = /components.md {
    return 301 /reference/$is_args$args;
}

# v2 renamed three items. The rule below would send these to their old names,
# which no longer exist, so a v1 link would 301 into a 404. Case-insensitive on
# the first, which also normalizes the historical `AnchorScrollto` casing.
location ~* ^/components/AnchorScrollTo(.*)$ {
    return 301 /reference/items/ScrollTo$1$is_args$args;
}

location ~ ^/components/LazyInclude(.*)$ {
    return 301 /reference/items/Defer$1$is_args$args;
}

location ~ ^/components/PrefetchWhenOver(.*)$ {
    return 301 /reference/items/Prefetch$1$is_args$args;
}

# v2 merged the two marquees into one `Marquee`. Both v1 names keep their
# sub-path, because the successor has the same `js-api`, `twig-api` and
# `examples` pages the two of them had between them.
location ~ ^/components/(LargeText|CircularMarquee)(.*)$ {
    return 301 /reference/items/Marquee$2$is_args$args;
}

# v2 dropped six families. Their pages are gone, so each goes to the component
# that supersedes it rather than to a 404 — the successor page is where a
# reader following a v1 link needs to end up. Nested paths are dropped: the
# successor has its own anatomy and examples, and a v1 sub-path has no
# counterpart under a different component.
location ~ ^/components/Accordion {
    return 301 /reference/items/Disclosure/$is_args$args;
}

location ~ ^/components/Frame {
    return 301 /reference/items/Fetch/$is_args$args;
}

location ~ ^/components/(Modal|Panel) {
    return 301 /reference/items/Dialog/$is_args$args;
}

location ~ ^/components/ScrollAnimation {
    return 301 /reference/items/Motion/$is_args$args;
}

location ~ ^/components/Slider {
    return 301 /reference/items/Carousel/$is_args$args;
}

# The same renames and drops, on the current prefix.
#
# `/components/` is the pre-1.0 prefix, but v1.10's own reference already lived
# at `/reference/items/`, so every link published from the 1.10 site to an item
# v2 renamed or dropped 404s without these. Each pattern is anchored to the end
# of the item name, so a longer v2 name starting with the same letters is never
# caught by one of them.
location ~* ^/reference/items/AnchorScrollTo(/.*)?$ {
    return 301 /reference/items/ScrollTo$1$is_args$args;
}

location ~ ^/reference/items/LazyInclude(/.*)?$ {
    return 301 /reference/items/Defer$1$is_args$args;
}

location ~ ^/reference/items/PrefetchWhenOver(/.*)?$ {
    return 301 /reference/items/Prefetch$1$is_args$args;
}

location ~ ^/reference/items/(LargeText|CircularMarquee)(/.*)?$ {
    return 301 /reference/items/Marquee$2$is_args$args;
}

location ~ ^/reference/items/(Accordion|AccordionItem)(/.*)?$ {
    return 301 /reference/items/Disclosure/$is_args$args;
}

location ~ ^/reference/items/Frame[A-Za-z]*(/.*)?$ {
    return 301 /reference/items/Fetch/$is_args$args;
}

location ~ ^/reference/items/(Modal|ModalWithTransition|Panel)(/.*)?$ {
    return 301 /reference/items/Dialog/$is_args$args;
}

location ~ ^/reference/items/(animationScrollWithEase|ScrollAnimation[A-Za-z]*|withScrollAnimationDebug)(/.*)?$ {
    return 301 /reference/items/Motion/$is_args$args;
}

location ~ ^/reference/items/Slider[A-Za-z]*(/.*)?$ {
    return 301 /reference/items/Carousel/$is_args$args;
}

location ~ ^/reference/items/withDeprecation(/.*)?$ {
    return 301 /reference/$is_args$args;
}

# Preserve all former item, example and API paths below /components/.
location ~ ^/components/(.*)$ {
    return 301 /reference/items/$1$is_args$args;
}
