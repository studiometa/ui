name: export-size

on:
  pull_request:
    branches:
      - main
    paths:
      - 'packages/ui/**'
      - 'packages/ui-mapbox/**'
      - 'packages/ui-motion/**'
      - 'package-lock.json'
      - '.github/workflows/export-size.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  export_size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: weareikko/export-size@1
        with:
          packages: |
            @studiometa/ui:packages/ui
            @studiometa/ui-mapbox:packages/ui-mapbox
            @studiometa/ui-motion:packages/ui-motion
          build: npm run build:export-size
