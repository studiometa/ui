name: export-size

on:
  pull_request:
    branches:
      - main

jobs:
  export_size:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'
      # Detect which packages the pull request affects. Each package re-runs when
      # its own sources, the shared build tooling, the lockfile, the root TS
      # config or this workflow change.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ui:
              - 'packages/ui/**'
              - 'scripts/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - '.github/workflows/export-size.yml'
            ui_mapbox:
              - 'packages/ui-mapbox/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - '.github/workflows/export-size.yml'
      # Build and measure only the affected packages. The export-size action
      # renders one comment with a section per path, so a single invocation with
      # the comma-joined paths avoids the comment clobbering that separate jobs
      # (which share one comment) would cause.
      - id: plan
        run: |
          build=""
          paths=""
          if [ "${{ steps.filter.outputs.ui }}" = "true" ]; then
            build="npm run build"
            paths="dist"
          fi
          if [ "${{ steps.filter.outputs.ui_mapbox }}" = "true" ]; then
            [ -n "$build" ] && build="$build && "
            build="${build}npm run build --workspace=@studiometa/ui-mapbox"
            [ -n "$paths" ] && paths="$paths,"
            paths="${paths}packages/ui-mapbox/dist"
          fi
          {
            echo "build=$build"
            echo "paths=$paths"
            [ -n "$paths" ] && echo "run=true" || echo "run=false"
          } >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.run == 'true'
        uses: titouanmathis/export-size-action@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          build_script: ${{ steps.plan.outputs.build }}
          paths: ${{ steps.plan.outputs.paths }}
          node-version: 24
