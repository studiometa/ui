name: export-size

on:
  pull_request:
    branches:
      - main
    paths:
      - 'packages/ui/**'
      - 'packages/ui-mapbox/**'
      - 'packages/ui-motion/**'
      - 'packages/ui-gsap/**'
      - 'package-lock.json'
      - '.github/workflows/export-size.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  export_size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: weareikko/export-size@aa6bed1e055800d94917055e9b34d6f85d1aba3a # 1.1.1
        with:
          packages: |
            @studiometa/ui:packages/ui
            @studiometa/ui-mapbox:packages/ui-mapbox
            @studiometa/ui-motion:packages/ui-motion
            @studiometa/ui-gsap:packages/ui-gsap
          build: npm run build:export-size
