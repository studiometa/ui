name: export-size

on:
  pull_request:
    branches:
      - main

jobs:
  export_size:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'
      # Detect which packages the pull request affects. Each package re-runs when
      # its own sources, the build tooling it actually uses, the shared root
      # TypeScript config it extends, or the lockfile change. `scripts/**` builds
      # only `@studiometa/ui` (into the root `dist`); `@studiometa/ui-mapbox` is
      # built by `packages/ui-mapbox/scripts/**`, already covered by its own glob.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ui:
              - 'packages/ui/**'
              - 'scripts/**'
              - 'tsconfig*.json'
              - 'package-lock.json'
            ui_mapbox:
              - 'packages/ui-mapbox/**'
              - 'tsconfig*.json'
              - 'package-lock.json'
      # Build and measure only the affected packages. The export-size action
      # renders one comment with a section per path, so a single invocation with
      # the comma-joined paths avoids the comment clobbering that separate jobs
      # (which share one comment) would cause. The action also builds the base
      # branch with the same command and runs it without a shell, so each case is
      # a single command that already exists on `main`; the combined case uses the
      # `build:export-size` script, where `&&` runs under npm's own shell.
      - id: plan
        run: |
          ui='${{ steps.filter.outputs.ui }}'
          mapbox='${{ steps.filter.outputs.ui_mapbox }}'
          if [ "$ui" = "true" ] && [ "$mapbox" = "true" ]; then
            build="npm run build:export-size"
            paths="dist,packages/ui-mapbox/dist"
          elif [ "$ui" = "true" ]; then
            build="npm run build"
            paths="dist"
          elif [ "$mapbox" = "true" ]; then
            build="npm run build --workspace=@studiometa/ui-mapbox"
            paths="packages/ui-mapbox/dist"
          fi
          {
            echo "build=$build"
            echo "paths=$paths"
            [ -n "$paths" ] && echo "run=true" || echo "run=false"
          } >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.run == 'true'
        uses: titouanmathis/export-size-action@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          build_script: ${{ steps.plan.outputs.build }}
          paths: ${{ steps.plan.outputs.paths }}
          node-version: 24
