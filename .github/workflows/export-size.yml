name: export-size

on:
  pull_request:
    branches:
      - main
    paths:
      - 'packages/ui/**'
      - 'packages/ui-mapbox/**'
      - 'scripts/export-size.mjs'
      - 'package-lock.json'

jobs:
  export_size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm install --no-audit --no-fund
      - name: Build the packages
        run: npm run build:export-size
      # Measure the published export sizes and render them into the job summary.
      # A local esbuild-based check (see scripts/export-size.mjs) replaces the
      # former third-party action, which could not resolve the packages' new
      # `typescript` export condition.
      - name: Measure export sizes
        run: node scripts/export-size.mjs
