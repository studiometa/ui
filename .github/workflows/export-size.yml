name: export-size

on:
  pull_request:
    branches:
      - main

jobs:
  export_size:
    runs-on: macos-latest
    name: export_size (${{ matrix.package }})
    strategy:
      # Report every package independently instead of failing the whole matrix
      # on the first one.
      fail-fast: false
      matrix:
        include:
          - package: '@studiometa/ui'
            build_script: npm run build
            paths: dist
            # Re-run when the package sources, the shared build tooling, the
            # lockfile, the root TS config or this workflow change.
            filter: |
              pkg:
                - 'packages/ui/**'
                - 'scripts/**'
                - 'package.json'
                - 'package-lock.json'
                - 'tsconfig*.json'
                - '.github/workflows/export-size.yml'
          - package: '@studiometa/ui-mapbox'
            build_script: npm run build --workspace=@studiometa/ui-mapbox
            paths: packages/ui-mapbox/dist
            filter: |
              pkg:
                - 'packages/ui-mapbox/**'
                - 'package.json'
                - 'package-lock.json'
                - 'tsconfig*.json'
                - '.github/workflows/export-size.yml'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'
      # Decide whether this package is affected by the pull request. The
      # export-size step is gated on this rather than the whole job, so an
      # unaffected package still reports a green check.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: ${{ matrix.filter }}
      - if: steps.filter.outputs.pkg == 'true'
        uses: titouanmathis/export-size-action@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          build_script: ${{ matrix.build_script }}
          paths: ${{ matrix.paths }}
          node-version: 24
