name: export-size

on:
  pull_request:
    branches:
      - main

jobs:
  export_size:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'
      # Detect which packages the pull request affects. Each package re-runs when
      # its own sources, the shared build tooling, the lockfile, the root TS
      # config or this workflow change.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ui:
              - 'packages/ui/**'
              - 'scripts/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - '.github/workflows/export-size.yml'
            ui_mapbox:
              - 'packages/ui-mapbox/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - '.github/workflows/export-size.yml'
      # Build and measure only the affected packages. The export-size action
      # renders one comment with a section per path, so a single invocation with
      # the comma-joined paths avoids the comment clobbering that separate jobs
      # (which share one comment) would cause. The action runs `build_script`
      # without a shell, so each case is a single npm command (the combined case
      # lives in the `build:export-size` script where `&&` runs under npm's shell).
      - id: plan
        run: |
          ui='${{ steps.filter.outputs.ui }}'
          mapbox='${{ steps.filter.outputs.ui_mapbox }}'
          if [ "$ui" = "true" ] && [ "$mapbox" = "true" ]; then
            build="npm run build:export-size"
            paths="dist,packages/ui-mapbox/dist"
          elif [ "$ui" = "true" ]; then
            build="npm run build"
            paths="dist"
          elif [ "$mapbox" = "true" ]; then
            build="npm run build:mapbox"
            paths="packages/ui-mapbox/dist"
          fi
          {
            echo "build=$build"
            echo "paths=$paths"
            [ -n "$paths" ] && echo "run=true" || echo "run=false"
          } >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.run == 'true'
        uses: titouanmathis/export-size-action@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          build_script: ${{ steps.plan.outputs.build }}
          paths: ${{ steps.plan.outputs.paths }}
          node-version: 24
