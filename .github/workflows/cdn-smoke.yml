name: cdn-smoke

# Runs the public CDN synthetic checks against the live base URL. These checks need no credentials,
# only a public base URL. Runs on a schedule and on manual dispatch, gated by CDN_ENABLED.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      browser:
        description: 'Also run the optional headless browser execution check.'
        type: boolean
        default: false

jobs:
  cdn_smoke:
    if: ${{ vars.CDN_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm install --no-audit --no-fund
      - name: Install the Chromium browser
        if: ${{ inputs.browser == true }}
        run: npm exec playwright -- install --with-deps chromium
      - name: Run the public CDN smoke checks
        run: node packages/cdn/scripts/smoke.ts --base-url "${CDN_BASE_URL}" ${{ inputs.browser == true && '--browser' || '' }}
        env:
          CDN_BASE_URL: ${{ vars.CDN_PUBLIC_BASE_URL }}
