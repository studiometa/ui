name: cdn-preview

# Builds a per-pull-request CDN preview: publishes the PR's build as an immutable
# `pr-<number>-<sha>` channel that the production Worker serves by its exact id (without touching
# the next/main tags), and uploads a preview version of the Worker itself. Restricted to same-repo
# pull requests, since it writes to the shared production bucket and index. Shares the
# cdn-publication concurrency group with the release/main jobs so no two runs rewrite versions.json
# at the same time. The companion cdn-preview-cleanup workflow prunes the channels when the PR
# closes.

on:
  pull_request:
    branches:
      - main
    paths:
      - 'packages/ui/**'
      - 'packages/ui-mapbox/**'
      - 'packages/cdn/**'
      - 'package-lock.json'
      - '.github/workflows/cdn-preview.yml'

jobs:
  cdn_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    concurrency:
      group: cdn-publication
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm install --no-audit --no-fund
      - name: Build the browser CDN distribution
        run: npm run cdn:build
      - name: Publish the pull-request preview channel
        run: node packages/cdn/scripts/publish.ts --pr "${PR_NUMBER}" --commit "${HEAD_SHA}"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CDN_S3_ENDPOINT: ${{ secrets.CDN_S3_ENDPOINT }}
          CDN_S3_BUCKET: ${{ secrets.CDN_S3_BUCKET }}
          CDN_S3_ACCESS_KEY_ID: ${{ secrets.CDN_S3_ACCESS_KEY_ID }}
          CDN_S3_SECRET_ACCESS_KEY: ${{ secrets.CDN_S3_SECRET_ACCESS_KEY }}
      - name: Comment the asset preview URL
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CDN_PUBLIC_BASE_URL: ${{ vars.CDN_PUBLIC_BASE_URL }}
        with:
          script: |
            const fs = require('fs');
            const base = (process.env.CDN_PUBLIC_BASE_URL || '').replace(/\/$/, '');
            const channel = `pr-${process.env.PR_NUMBER}-${process.env.HEAD_SHA.slice(0, 12)}`;
            // Read the js-toolkit version this build pins from the emitted build.json so the manual
            // import example points at the exact URL the ui tree resolves internally.
            const uiRoot = 'packages/cdn/dist/releases/ui';
            const uiVersion = fs.readdirSync(uiRoot)[0];
            const build = JSON.parse(fs.readFileSync(`${uiRoot}/${uiVersion}/build.json`, 'utf8'));
            const jsToolkit = build.dependencies['@studiometa/js-toolkit'];
            const marker = '<!-- cdn-asset-preview -->';
            const body = [
              marker,
              '### CDN asset preview',
              '',
              `This pull request's build is published as the immutable channel \`${channel}\`.`,
              '',
              '**Declarative autoloader** — one script; components mount from their `data-component`:',
              '```html',
              `<script type="module" src="${base}/ui@${channel}/autoload.js" data-studiometa-ui></script>`,
              '```',
              '',
              '**Manual ESM imports** — the full package surfaces at their pinned URLs:',
              '```js',
              `import { Base, createApp } from "${base}/js-toolkit@${jsToolkit}/index.js";`,
              `import { Action } from "${base}/ui@${channel}/index.js";`,
              '```',
              '',
              'It is pruned from the index automatically when the PR closes.',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.PR_NUMBER);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
      # Best-effort: `versions upload` needs the Worker to already exist, and the Worker is first
      # created by `wrangler deploy` in cdn-main on merge. Until that first deploy this step fails,
      # so it must not fail the job — the asset preview above is the primary artifact. Once the
      # Worker exists, this uploads a preview version and comments its URL on every PR.
      - name: Upload a preview version of the CDN Worker
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CDN_CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CDN_CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/cdn
          command: versions upload
          # With a token, wrangler-action comments the Worker preview URL on the pull request.
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
