name: changelog

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Every change to a published package needs a fragment in .changelog/,
      # unless the pull request has the `no-changelog` label (tests, docs,
      # refactors, tooling).
      - uses: weareikko/changelog@fce59bfe7b620305dfcc222f1b150dda9c3cc157 # 0.1.3
        with:
          command: check
          require-paths: |
            packages/ui/**
            packages/ui-mapbox/**
            packages/ui-motion/**
            packages/eslint-plugin-ui/**
            packages/twig-extension/**
