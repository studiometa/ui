name: changelog

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Every change to a published package needs a fragment in .changelog/,
      # unless the pull request has the `no-changelog` label (tests, docs,
      # refactors, tooling).
      - uses: weareikko/changelog@cb24219df8d46e3549a6fe5c10e06f9b01e5011e # 1.0.1
        with:
          command: check
          require-paths: |
            packages/ui/**
            packages/ui-mapbox/**
            packages/ui-motion/**
            packages/eslint-plugin-ui/**
            packages/twig-extension/**
