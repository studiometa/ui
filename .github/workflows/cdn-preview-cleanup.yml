name: cdn-preview-cleanup

# Prunes a pull request's `pr-<number>-<sha>` preview channels from versions.json once the PR is
# closed (merged or not), so the Worker stops resolving them. The immutable channel objects are
# left in place (unreferenced) and can be garbage-collected out of band. Restricted to same-repo
# pull requests; shares the cdn-publication concurrency group so it never rewrites the index
# alongside a publish.

on:
  pull_request:
    types:
      - closed

jobs:
  cdn_preview_cleanup:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    concurrency:
      group: cdn-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm install --no-audit --no-fund
      - name: Prune the pull-request preview channels
        run: node packages/cdn/scripts/rollback.ts --prune-pr "${PR_NUMBER}"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CDN_S3_ENDPOINT: ${{ secrets.CDN_S3_ENDPOINT }}
          CDN_S3_BUCKET: ${{ secrets.CDN_S3_BUCKET }}
          CDN_S3_ACCESS_KEY_ID: ${{ secrets.CDN_S3_ACCESS_KEY_ID }}
          CDN_S3_SECRET_ACCESS_KEY: ${{ secrets.CDN_S3_SECRET_ACCESS_KEY }}
