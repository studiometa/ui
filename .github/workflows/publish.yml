name: release

# Each merge into 2.x releases the 2.x line from what its fragments describe:
# prereleases while `.changelog/prerelease` exists, 2.0.0 once a pull request
# deletes it. A manual run (`gh workflow run publish.yml --ref 2.x -f version=major`)
# forces a bump. main has its own release workflow.
# npm trusted publishing is bound to this file name: keep the publish job here.
on:
  push:
    branches: [2.x]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version: `auto` follows the fragments; `patch`, `minor` or `major` forces that bump'
        type: choice
        options: [auto, patch, minor, major]
        default: auto

# One release at a time per line, so that main and 2.x do not wait for each
# other. GitHub keeps only the newest pending run: it releases everything that
# 2.x has at that point.
concurrency:
  group: release-2.x
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Get npm cache directory
        id: npm-cache-dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: npm-cache
        with:
          path: |
            ${{ steps.npm-cache-dir.outputs.dir }}
            **/node_modules
            .eslintcache
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - run: npm install --no-audit --no-fund

      - run: npm run build

      # The component specs run in a real Chromium through Vitest browser mode,
      # so the runner needs the browser binary. No `--with-deps`: that installs
      # system packages through apt and is Ubuntu-only.
      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Test
        run: npm run test -- -- --coverage.enabled

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./packages/coverage
          flags: unittests
          fail_ci_if_error: false
          verbose: true

  # Folds the fragments, bumps every package and composer.json (root
  # `postversion` script), commits `Prepare <version>`, tags, pushes and
  # creates the GitHub release. Packagist reads the tag.
  release:
    name: Release
    needs: test
    runs-on: ubuntu-latest
    # 2.x releases from the 2.x branch only.
    if: github.ref == 'refs/heads/2.x'
    permissions:
      contents: write
      pull-requests: read
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Release
        id: release
        uses: weareikko/changelog@9d93346df9858eaa29007bd8530aad8f4c5b539a # 0.1.0
        with:
          command: release
          version: ${{ inputs.version || 'auto' }}
          commit-message: 'Prepare {version}'

  # "Re-run failed jobs" on this job publishes what a failed run left: npm
  # skips a version that it already has.
  publish:
    name: Publish to npm
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      # The 1.x line on main owns `latest`, so every 2.x version goes to `next`.
      # Move 2.x to `latest` when it becomes the stable line.
      DIST_TAG: next
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ needs.release.outputs.version }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: 'npm'

      # The action publishes with --ignore-scripts: this step builds the
      # `dist/` of every published package, and the test job ran the checks.
      - name: Install and build
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm run build -w @studiometa/eslint-plugin-ui -w @studiometa/ui-mapbox -w @studiometa/ui-motion

      # Trusted publishing (OIDC): no npm token.
      - name: Publish @studiometa/ui
        uses: JS-DevTools/npm-publish@0fd2f4369c5d6bcfcde6091a7c527d810b9b5c3f # v4.1.5
        with:
          package: packages/ui
          access: public
          provenance: true
          tag: ${{ env.DIST_TAG }}

      - name: Publish @studiometa/eslint-plugin-ui
        uses: JS-DevTools/npm-publish@0fd2f4369c5d6bcfcde6091a7c527d810b9b5c3f # v4.1.5
        with:
          package: packages/eslint-plugin-ui
          access: public
          provenance: true
          tag: ${{ env.DIST_TAG }}

      - name: Publish @studiometa/ui-mapbox
        uses: JS-DevTools/npm-publish@0fd2f4369c5d6bcfcde6091a7c527d810b9b5c3f # v4.1.5
        with:
          package: packages/ui-mapbox
          access: public
          provenance: true
          tag: ${{ env.DIST_TAG }}

      - name: Publish @studiometa/ui-motion
        uses: JS-DevTools/npm-publish@0fd2f4369c5d6bcfcde6091a7c527d810b9b5c3f # v4.1.5
        with:
          package: packages/ui-motion
          access: public
          provenance: true
          tag: ${{ env.DIST_TAG }}
