name: release

on:
  push:
    tags:
      - '*.*.*'

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Get npm cache directory
        id: npm-cache-dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> ${GITHUB_OUTPUT}

      - uses: actions/cache@v4
        id: npm-cache
        with:
          path: |
            ${{ steps.npm-cache-dir.outputs.dir }}
            **/node_modules
            .eslintcache
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - run: npm install --no-audit --no-fund

      - run: npm run build

      - name: Test
        run: npm run test -- -- --coverage.enabled

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./packages/coverage
          flags: unittests
          fail_ci_if_error: false
          verbose: true

      - run: |
          NPM_TAG='latest'
          IS_PRERELEASE=false

          if [[ $GITHUB_REF_NAME =~ 'alpha' || $GITHUB_REF_NAME =~ 'beta' || $GITHUB_REF_NAME =~ 'rc' ]]; then
            NPM_TAG='next'
            IS_PRERELEASE=true
          fi

          echo "NPM_TAG=$NPM_TAG" >> $GITHUB_ENV
          echo "IS_PRERELEASE=$IS_PRERELEASE" >> $GITHUB_ENV

      - uses: JS-DevTools/npm-publish@v3
        with:
          provenance: true
          package: dist/
          tag: ${{ env.NPM_TAG }}
          token: ${{ secrets.NPM_TOKEN }}

      - name: Build eslint-plugin-ui
        run: npm run build -w @studiometa/eslint-plugin-ui

      - uses: JS-DevTools/npm-publish@v3
        with:
          provenance: true
          package: packages/eslint-plugin-ui/
          tag: ${{ env.NPM_TAG }}
          token: ${{ secrets.NPM_TOKEN }}

      - name: Build ui-mapbox
        run: npm run build -w @studiometa/ui-mapbox

      - uses: JS-DevTools/npm-publish@v3
        with:
          provenance: true
          package: packages/ui-mapbox/dist/
          tag: ${{ env.NPM_TAG }}
          token: ${{ secrets.NPM_TOKEN }}

      - uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref }}
          name: v${{ github.ref_name }}
          body: Please refer to [CHANGELOG.md](https://github.com/studiometa/ui/blob/${{ github.ref_name }}/CHANGELOG.md) for details.
          draft: false
          prerelease: ${{ env.IS_PRERELEASE }}

  # Publishes the browser CDN artifact for a tagged release. It runs only after the npm release
  # succeeds and is fully isolated, so it can never affect npm publication. The CDN artifact is
  # never itself published to npm. Gated by the CDN_ENABLED repository variable and scoped secrets.
  cdn_release:
    needs: release
    if: ${{ vars.CDN_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: cdn-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm install --no-audit --no-fund
      - name: Build the browser CDN distribution
        run: npm run cdn:build
      - name: Publish the CDN stable release
        run: node packages/cdn/scripts/publish.ts --git-tag "${GITHUB_REF_NAME}"
        env:
          CDN_S3_ENDPOINT: ${{ secrets.CDN_S3_ENDPOINT }}
          CDN_S3_BUCKET: ${{ secrets.CDN_S3_BUCKET }}
          CDN_S3_ACCESS_KEY_ID: ${{ secrets.CDN_S3_ACCESS_KEY_ID }}
          CDN_S3_SECRET_ACCESS_KEY: ${{ secrets.CDN_S3_SECRET_ACCESS_KEY }}
          CDN_CLOUDFLARE_API_TOKEN: ${{ secrets.CDN_CLOUDFLARE_API_TOKEN }}
          CDN_CLOUDFLARE_ZONE_ID: ${{ secrets.CDN_CLOUDFLARE_ZONE_ID }}
          CDN_PUBLIC_BASE_URL: ${{ vars.CDN_PUBLIC_BASE_URL }}
