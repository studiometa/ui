name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New 1.x version: patch, minor, major, or an exact version such as 1.12.0 or 1.12.0-beta.0'
        type: string
        required: true
        default: patch

concurrency: release

jobs:
  version:
    name: Bump version and changelog
    runs-on: ubuntu-latest
    # 1.x releases from main only. The 2.x branch has its own release workflow.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: read
    outputs:
      tag: ${{ steps.version.outputs.version }}
      body: ${{ steps.changelog.outputs.body }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The changelog action reads the commit that added each fragment.
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      # The root `postversion` script bumps every workspace and composer.json.
      - name: Bump version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version
          echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Fold changelog fragments
        id: changelog
        uses: weareikko/changelog@c25888e03ad7c8bbaee897b84e778ebce9e9301c # 1.0.3
        with:
          command: release
          version: v${{ steps.version.outputs.version }}

      - name: Fail when there is nothing to release
        if: steps.changelog.outputs.changed != 'true'
        run: |
          echo "::error::No fragment in .changelog/: nothing to release."
          exit 1

      - name: Commit, tag and push
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md .changelog composer.json package.json package-lock.json packages/*/package.json
          git commit -m "Prepare $VERSION"
          git tag -a "$VERSION" -m "v$VERSION"
          git push origin HEAD:main "$VERSION"

  # A tag pushed with GITHUB_TOKEN does not start other workflows, so the
  # publish job runs in this same workflow. It must stay in this file: npm
  # trusted publishing is configured for `publish.yml`.
  release:
    needs: version
    runs-on: macos-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Get npm cache directory
        id: npm-cache-dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: npm-cache
        with:
          path: |
            ${{ steps.npm-cache-dir.outputs.dir }}
            **/node_modules
            .eslintcache
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - run: npm install --no-audit --no-fund

      - run: npm run build

      - name: Test
        run: npm run test -- -- --coverage.enabled

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./packages/coverage
          flags: unittests
          fail_ci_if_error: false
          verbose: true

      # The 1.x line owns the `latest` dist-tag. Its prereleases use `next-1.x`,
      # because the 2.x branch owns `next`.
      - env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          NPM_TAG='latest'
          IS_PRERELEASE=false

          if [[ $TAG == *-* ]]; then
            NPM_TAG='next-1.x'
            IS_PRERELEASE=true
          fi

          echo "NPM_TAG=$NPM_TAG" >> "$GITHUB_ENV"
          echo "IS_PRERELEASE=$IS_PRERELEASE" >> "$GITHUB_ENV"

      # Tokenless trusted publishing (npm OIDC): each package is configured as a trusted publisher
      # on npm, so `npm publish` authenticates through the `id-token: write` permission declared
      # above — no NPM_TOKEN — and provenance is attested from the same OIDC flow. Mirrors the
      # working setup in @weareikko/code-review; Node 24's bundled npm (>= 11.5.1) supports it.
      - name: Publish @studiometa/ui
        run: npm publish --provenance --access public --tag "$NPM_TAG"
        working-directory: packages/ui

      - name: Build @studiometa/eslint-plugin-ui
        run: npm run build -w @studiometa/eslint-plugin-ui
      - name: Publish @studiometa/eslint-plugin-ui
        run: npm publish --provenance --access public --tag "$NPM_TAG"
        working-directory: packages/eslint-plugin-ui

      - name: Build @studiometa/ui-mapbox
        run: npm run build -w @studiometa/ui-mapbox
      - name: Publish @studiometa/ui-mapbox
        run: npm publish --provenance --access public --tag "$NPM_TAG"
        working-directory: packages/ui-mapbox

      - name: Build @studiometa/ui-motion
        run: npm run build -w @studiometa/ui-motion
      - name: Publish @studiometa/ui-motion
        run: npm publish --provenance --access public --tag "$NPM_TAG"
        working-directory: packages/ui-motion

      - uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ needs.version.outputs.tag }}
          name: v${{ needs.version.outputs.tag }}
          body: ${{ needs.version.outputs.body }}
          draft: false
          prerelease: ${{ env.IS_PRERELEASE }}
