name: cdn-main

# Publishes an immutable main-<sha> CDN channel for a successful build of the default branch.
# It triggers only after the build workflow completes successfully on main, is gated by the
# CDN_ENABLED repository variable, and shares the cdn-publication concurrency group with the
# tagged release job so the two never publish at the same time.

on:
  workflow_run:
    workflows: ['build']
    types:
      - completed
    branches:
      - main

jobs:
  cdn_main:
    if: ${{ github.event.workflow_run.conclusion == 'success' && vars.CDN_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: cdn-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm install --no-audit --no-fund
      - name: Build the browser CDN distribution
        run: npm run cdn:build
      - name: Publish the CDN main channel
        run: node packages/cdn/scripts/publish.ts --channel main --commit "${HEAD_SHA}"
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CDN_S3_ENDPOINT: ${{ secrets.CDN_S3_ENDPOINT }}
          CDN_S3_BUCKET: ${{ secrets.CDN_S3_BUCKET }}
          CDN_S3_ACCESS_KEY_ID: ${{ secrets.CDN_S3_ACCESS_KEY_ID }}
          CDN_S3_SECRET_ACCESS_KEY: ${{ secrets.CDN_S3_SECRET_ACCESS_KEY }}
          CDN_MAPBOX_REDISTRIBUTION_APPROVED: ${{ vars.CDN_MAPBOX_REDISTRIBUTION_APPROVED }}
          CDN_CLOUDFLARE_API_TOKEN: ${{ secrets.CDN_CLOUDFLARE_API_TOKEN }}
          CDN_CLOUDFLARE_ZONE_ID: ${{ secrets.CDN_CLOUDFLARE_ZONE_ID }}
          CDN_PUBLIC_BASE_URL: ${{ vars.CDN_PUBLIC_BASE_URL }}
